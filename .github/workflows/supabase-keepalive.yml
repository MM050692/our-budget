name: Keep Supabase Active

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-keepalive.yml"
      - "supabase/migrations/*keepalive*.sql"
  schedule:
    # Three lightweight requests per day. Times are UTC.
    - cron: "17 1,9,17 * * *"
    # A monthly repository pulse prevents GitHub from disabling this scheduled
    # workflow after 60 days without repository activity.
    - cron: "43 3 1 * *"
  workflow_dispatch:
    inputs:
      refresh_schedule:
        description: "Record a repository activity pulse"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase database
        shell: bash
        run: |
          set -euo pipefail
          URL="https://wdtlkqcgyjvosejolyqd.supabase.co/rest/v1/rpc/keepalive"
          KEY="sb_publishable_58FcG-q9hZgmi7osTfXvBA_tytG73LR"

          # The publishable key is intentionally safe for client-side/public use.
          # This RPC returns only true and cannot read household data.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/supabase-response.txt -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              --request POST \
              -H "apikey: $KEY" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "$URL" || true)

            response=$(tr -d '[:space:]' < /tmp/supabase-response.txt 2>/dev/null || true)
            if [ "$code" = "200" ] && [ "$response" = "true" ]; then
              echo "Supabase keep-alive succeeded (HTTP $code)."
              exit 0
            fi

            echo "Attempt $attempt failed with HTTP $code."
            cat /tmp/supabase-response.txt 2>/dev/null || true
            sleep 10
          done

          echo "Supabase keep-alive failed after 3 attempts."
          exit 1

  keep-schedule-enabled:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.refresh_schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Record monthly workflow activity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          month=$(date -u +%Y-%m)
          path=".github/keepalive-pulse.txt"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          current_sha=$(curl -fsS "${headers[@]}" "${api}?ref=${GITHUB_REF_NAME}" \
            | jq -r '.sha // empty' || true)
          encoded=$(printf 'Our DHAN continuity pulse: %s\n' "$month" | base64 -w 0)

          if [ -n "$current_sha" ]; then
            payload=$(jq -n \
              --arg message "chore: keep continuity checks active (${month}) [skip ci]" \
              --arg content "$encoded" \
              --arg branch "$GITHUB_REF_NAME" \
              --arg sha "$current_sha" \
              '{message: $message, content: $content, branch: $branch, sha: $sha}')
          else
            payload=$(jq -n \
              --arg message "chore: keep continuity checks active (${month}) [skip ci]" \
              --arg content "$encoded" \
              --arg branch "$GITHUB_REF_NAME" \
              '{message: $message, content: $content, branch: $branch}')
          fi

          curl -fsS --request PUT "${headers[@]}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$api" >/dev/null

          echo "GitHub schedule activity recorded for ${month}."
