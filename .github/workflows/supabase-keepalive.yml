name: Keep Supabase Active

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-keepalive.yml"
      - "supabase/migrations/*keepalive*.sql"
  schedule:
    # Three lightweight requests per day. Times are UTC.
    - cron: "17 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase database
        shell: bash
        run: |
          set -euo pipefail
          URL="https://wdtlkqcgyjvosejolyqd.supabase.co/rest/v1/rpc/keepalive"
          KEY="sb_publishable_58FcG-q9hZgmi7osTfXvBA_tytG73LR"

          # The publishable key is intentionally safe for client-side/public use.
          # This RPC returns only true and cannot read household data.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/supabase-response.txt -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              --request POST \
              -H "apikey: $KEY" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "$URL" || true)

            response=$(tr -d '[:space:]' < /tmp/supabase-response.txt 2>/dev/null || true)
            if [ "$code" = "200" ] && [ "$response" = "true" ]; then
              echo "Supabase keep-alive succeeded (HTTP $code)."
              exit 0
            fi

            echo "Attempt $attempt failed with HTTP $code."
            cat /tmp/supabase-response.txt 2>/dev/null || true
            sleep 10
          done

          echo "Supabase keep-alive failed after 3 attempts."
          exit 1
